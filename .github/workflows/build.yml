name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q Daftri_App_Project.zip -d proj
      - name: Build
        run: |
          cd proj/Daftri/android
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Daftri-APK
          path: proj/Daftri/android/app/build/outputs/apk/debug/app-debug.apk
